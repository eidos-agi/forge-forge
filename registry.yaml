- name: shipr
  type: tool
  description: AI shipping config + release memory. Stores how a product ships under .shipr/ (committed).
    Does not ship/deploy/run proofs — agents do. Absorbs testr test_commands as proof_commands. Successor
    of ship-forge methods.
  repo: eidos-agi/shipr
  invocation: cli
  prerequisites:
    clone: false
    pip: false
  artifacts:
  - .shipr/product-release-model.json
  - .shipr/release-attempts/
  example: shipr model --project . --write --json && shipr frontier --project . --json
  status: active
  supersedes: ship-forge
  related:
  - testr
  - foss-forge
  - security-forge
  - learning-forge
  - loss-forge
  tools:
  - shipr_model: Detect/write product-release-model.json (creates sibling .testr if missing)
  - shipr_attempt: Record release attempt ledger entry (no execute)
  - shipr_frontier: Next shipping actions for the AI agent
  - shipr_store: Marketplace plugin check (stub in Go)
- name: testr
  type: tool
  description: AI testing config + proof memory. Stores how a product is proven under .testr/ (committed).
    Does not run tests — agents do. Sibling of shipr; shipr prefers testr test_commands as proofs. Successor
    of retired test-forge.
  repo: eidos-agi/testr
  invocation: cli
  prerequisites:
    clone: false
    pip: false
  artifacts:
  - .testr/product-test-model.json
  - .testr/test-attempts/
  example: testr model --project . --write --json && testr frontier --project . --json
  status: active
  supersedes: test-forge
  related:
  - shipr
  tools:
  - testr_model: Detect/write product-test-model.json (creates sibling .shipr if missing)
  - testr_attempt: Record test attempt ledger entry (no execute)
  - testr_frontier: Next test actions for the AI agent
